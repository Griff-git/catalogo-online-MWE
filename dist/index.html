    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#fc5200',
              secondary: '#1e293b',
              accent: '#0ea5e9',
            },
            borderRadius: {
              '2xl': '1rem',

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      
      :root {
        --color-primary: #fc5200;
        --color-secondary: #1e293b;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      
      /* Custom Scrollbar */
      
      ::-webkit-scrollbar {
        width: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
      }
      
      /* ========== DARK MODE ========== */
      
      html.dark { color-scheme: dark; }
      
      html.dark body {
        background-color: #0f172a;
        color: #e2e8f0;
      }
      
      /* Backgrounds */
      
      html.dark .bg-white { background-color: #1e293b !important; }
      
      html.dark .bg-gray-50,
      html.dark .bg-slate-50 { background-color: #0f172a !important; }
      
      html.dark .bg-gray-100,
      html.dark .bg-slate-100 { background-color: #334155 !important; }
      
      html.dark .bg-gray-200 { background-color: #475569 !important; }
      
      html.dark .bg-gray-900 { background-color: #f1f5f9 !important; }
      
      /* Text Colors */
      
      html.dark .text-gray-900 { color: #f1f5f9 !important; }
      
      html.dark .text-gray-800 { color: #e2e8f0 !important; }
      
      html.dark .text-gray-700 { color: #cbd5e1 !important; }
      
      html.dark .text-gray-600 { color: #94a3b8 !important; }
      
      html.dark .text-gray-500 { color: #94a3b8 !important; }
      
      html.dark .text-gray-400 { color: #64748b !important; }
      
      html.dark .text-gray-300 { color: #475569 !important; }
      
      /* Borders */
      
      html.dark .border-gray-50 { border-color: #1e293b !important; }
      
      html.dark .border-gray-100 { border-color: #334155 !important; }
      
      html.dark .border-gray-200 { border-color: #475569 !important; }
      
      html.dark .border-gray-300 { border-color: #475569 !important; }
      
      html.dark .border-slate-100 { border-color: #334155 !important; }
      
      /* Inputs, Selects, Textareas */
      
      html.dark input,
      html.dark select,
      html.dark textarea {
        background-color: #0f172a;
        color: #e2e8f0;
        border-color: #334155;
      }
      
      html.dark input::placeholder,
      html.dark textarea::placeholder {
        color: #475569;
      }
      
      html.dark select option {
        background-color: #1e293b;
        color: #e2e8f0;
      }
      
      /* Hover states */
      
      html.dark .hover\:bg-gray-50:hover { background-color: #334155 !important; }
      
      html.dark .hover\:bg-gray-100:hover { background-color: #475569 !important; }
      
      html.dark .hover\:bg-gray-200:hover { background-color: #475569 !important; }
      
      /* Focus rings */
      
      html.dark .focus\:ring-primary\/10:focus { --tw-ring-color: rgb(252 82 0 / 0.2) !important; }
      
      html.dark .focus\:ring-primary\/20:focus { --tw-ring-color: rgb(252 82 0 / 0.3) !important; }
      
      /* Shadows */
      
      html.dark .shadow-sm { box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.4) !important; }
      
      html.dark .shadow-lg { box-shadow: 0 4px 12px 0 rgb(0 0 0 / 0.5) !important; }
      
      html.dark .shadow-xl { box-shadow: 0 8px 24px 0 rgb(0 0 0 / 0.5) !important; }
      
      html.dark .shadow-2xl { box-shadow: 0 12px 40px 0 rgb(0 0 0 / 0.6) !important; }
      
      html.dark .shadow-inner { box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.3) !important; }
      
      /* Product image: disable mix-blend-multiply in dark mode */
      
      html.dark .mix-blend-multiply { mix-blend-mode: normal !important; }
      
      /* Scrollbar */
      
      html.dark ::-webkit-scrollbar-track { background: #1e293b; }
      
      html.dark ::-webkit-scrollbar-thumb { background: #475569; }
      
      /* Glass card */
      
      html.dark .glass-card {
        background: rgba(30, 41, 59, 0.8);
        border-color: rgba(51, 65, 85, 0.5);
      }
      
      /* Specific overrides for colored backgrounds that shouldn't invert */
      
      html.dark .bg-red-500,
      html.dark .bg-red-50,
      html.dark .bg-red-100,
      html.dark .bg-green-50,
      html.dark .bg-green-600,
      html.dark .bg-green-700,
      html.dark .bg-blue-50,
      html.dark .bg-yellow-500,
      html.dark .bg-amber-500 {
        /* preserve original colors - no override */
      }
      
      /* Red/Green subtle backgrounds need darker versions in dark mode */
      
      html.dark .bg-red-50 { background-color: rgba(239, 68, 68, 0.1) !important; }
      
      html.dark .bg-red-100 { background-color: rgba(239, 68, 68, 0.15) !important; }
      
      html.dark .bg-green-50 { background-color: rgba(34, 197, 94, 0.1) !important; }
      
      html.dark .bg-blue-50 { background-color: rgba(59, 130, 246, 0.1) !important; }
      
      /* Backdrop for modals */
      
      html.dark .bg-black\/40 { background-color: rgba(0, 0, 0, 0.6) !important; }
      
      /* Transition overlay */
      
      html.dark .bg-white.pointer-events-none,
      html.dark div[class*="pointer-events-none"][class*="bg-white"] {
        background-color: #0f172a !important;
      }
    </style>
